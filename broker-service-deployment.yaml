apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: broker-service
  template:
    metadata:
      labels:
        app: broker-service
    spec:
      containers:
      - name: broker-service
        image: 727646499255.dkr.ecr.ap-south-1.amazonaws.com/snipptree/broker-service:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: broker-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: broker-service
